---
layout: default
---
<article class="network-page">
  <p class="label">capítulo {{ page.numero }}</p>
  <h1>{{ page.title }}</h1>
  {{ content }}

  <div class="network-toolbar">
    <button class="filter-chip" data-type="pessoa">● pessoas</button>
    <button class="filter-chip" data-type="texto">● textos</button>
    <button class="filter-chip" data-type="lugar">● lugares</button>
    <button class="filter-chip" data-type="som">● sons</button>
    <input class="filter-chip" placeholder="buscar nó…">
  </div>

  <div class="network-body">
    <div id="network-canvas" class="network-canvas"
         data-source="{{ '/assets/data/network.json' | relative_url }}"></div>
    <div id="network-detail" class="network-detail">
      <span class="label">painel de detalhe</span>
      <p>clique num nó para ver nome, tipo, capítulo relacionado e mídia associada.</p>
    </div>
  </div>
</article>

<script src="{{ '/assets/js/network.js' | relative_url }}" defer></script>
