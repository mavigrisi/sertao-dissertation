<div class="minimap">
  <span class="label">navegação</span>
  <ul class="minimap-list">
    {% assign sorted_chapters = site.chapters | sort: "numero" %}
    {% for c in sorted_chapters %}
      <li{% if c.url == page.url %} class="current"{% endif %}>
        <a href="{{ c.url | relative_url }}">{{ c.numero }}. {{ c.title }}</a>
      </li>
    {% endfor %}
  </ul>
</div>
